# Finds common security mistakes in the code (SECURITY_PLAN S7.10). Free for public repos,
# and on private ones with GitHub Advanced Security.

name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      # It reads its own workflow run: without this, "Resource not accessible by integration" (2026-11-12).
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
