# Log in with email from the Profile tab. Params: EMAIL, PASSWORD.
appId: com.sahla
---
- tapOn: "Profile"
- tapOn: "Sign In"
- tapOn: "Continue with Email"
- tapOn: "Email Address"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "LOG IN"
- extendedWaitUntil:
    visible: "Profile & Settings" # signed in (Log Out may be below the fold)
    timeout: 15000
