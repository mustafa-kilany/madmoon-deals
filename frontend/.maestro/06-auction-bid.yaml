# Part 1 of an auction on the real backend: bid, get outbid (scripts/rival-bids.js), see it without
# reloading, bid again and lead. Part 2 is 07, after the auction ends:
# in backend/, with the test database: npx tsx scripts/e2e-end-auction.ts auction-fashion
appId: com.sahla
name: Bid, get outbid, bid again
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ahmad@sahla.jo
      PASSWORD: sahla1234
- runFlow: subflows/accept-terms.yaml

- tapOn: "Home"
- tapOn: "Search for anything..."
- tapOn: "Search for anything..."
- inputText: "Luxury Watch"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Luxury Watch"
    timeout: 10000
- tapOn:
    text: "Luxury Watch"
    below:
      text: '\d+ results?'
- extendedWaitUntil:
    visible: "Current Highest Bid"
    timeout: 10000

# Too low is refused here, with the minimum.
- tapOn: "Your Bid (JOD)"
- inputText: "1"
- hideKeyboard
- tapOn: "Place Bid"
- extendedWaitUntil:
    visible: 'Minimum required bid.*'
    timeout: 5000

- tapOn: "+25 JOD"
- tapOn: "Place Bid"
- extendedWaitUntil:
    visible: "Ahmad"
    timeout: 10000

- runScript:
    file: scripts/rival-bids.js
    env:
      LISTING: auction-fashion
      AMOUNT: "300000"
      API: ${API}
# The page polls: the rival's bid and new price arrive on their own.
- extendedWaitUntil:
    visible: 'Minimum required bid.*301.*'
    timeout: 15000

- tapOn: "+25 JOD"
- tapOn: "Place Bid"
- extendedWaitUntil:
    visible: 'Minimum required bid.*32[0-9].*'
    timeout: 15000
