# Buyer pays into escrow and gets a PIN; the courier confirms the delivery
# with that PIN and the order completes. Mock orders live in app memory, so
# both accounts run in one app session.
appId: com.sahla
name: Buy, then courier confirms delivery
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ahmad@sahla.jo
      PASSWORD: sahla1234

# Find a fixed-price listing and pay with the saved card
- tapOn: "Home"
- tapOn: "Search for anything..."
- inputText: "14 pro"
- hideKeyboard
- extendedWaitUntil:
    visible: "iPhone 14 Pro"
    timeout: 10000
- tapOn: "iPhone 14 Pro"
- tapOn: "Pay Now"
- assertVisible: "Secure Checkout"

# No saved address yet (fresh app), so checkout offers to use the location.
# Type it instead: the emulator's GPS is in California.
- assertVisible: "Deliver to where you are?"
- tapOn: "I'll type it myself"

# Delivery details: name and area come from the profile
- scrollUntilVisible:
    element:
        id: "delivery-phone"
- tapOn:
    id: "delivery-phone"
- inputText: "0791234567"
- hideKeyboard
- scrollUntilVisible:
    element:
        id: "delivery-address"
- tapOn:
    id: "delivery-address"
- inputText: "Mecca St, Building 12, 3rd floor"
- hideKeyboard
- scrollUntilVisible:
    element:
        text: 'Pay \d.*'
- tapOn: 'Pay \d.*'
- extendedWaitUntil:
    visible: "Track Order"
    timeout: 15000
- assertVisible: "Delivery PIN"

# Remember the order number and PIN for the courier
- copyTextFrom:
    id: "order-number"
- evalScript: ${output.orderId = maestro.copiedText.match(/SA-\d+/)[0]}
- copyTextFrom:
    id: "order-pin"
- evalScript: ${output.pin = maestro.copiedText.replace(/\D/g, '')}

# Courier confirms
- runFlow: subflows/sign-out.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: courier@sahla.jo
      PASSWORD: sahla1234
- tapOn: "Home"
- tapOn: "Open menu"
- tapOn: "Confirm a Delivery"
- tapOn: "Order number (e.g. SA-123456)"
- inputText: ${output.orderId}
- tapOn: "Delivery PIN"
- inputText: ${output.pin}
- hideKeyboard
- tapOn: "Confirm Delivery"
- extendedWaitUntil:
    visible: "Delivery confirmed. Payment released to the seller."
    timeout: 10000
