# Log in with email from the Profile tab. Params: EMAIL, PASSWORD.
appId: com.sahla
---
- tapOn: "Profile"
- tapOn: "Sign In"
- tapOn: "Continue with Email"
- tapOn: "Already have an account? Log in"
- tapOn: "Email Address"
- inputText: ${EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "LOG IN"
- extendedWaitUntil:
    visible: "Log Out"
    timeout: 15000
