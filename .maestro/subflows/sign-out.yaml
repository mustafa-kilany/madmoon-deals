appId: com.sahla
---
# Back out to the tab bar from wherever the flow is.
- repeat:
    times: 5
    while:
      notVisible: "Profile"
    commands:
      - back
- tapOn: "Profile"
- scrollUntilVisible:
    element:
      text: "Log Out"
- tapOn: "Log Out"
- extendedWaitUntil:
    visible: "Welcome to Sahla" # signed out → guest Home
    timeout: 10000
